<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중3 영어 단원별 어휘 학습기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1 id="unit-title">Lesson 1. New Beginnings</h1>
            <div class="progress-bar-container">
                <div id="progress-bar" style="width: 0%;"></div>
            </div>
        </header>

        <main>
            <section id="step-study" class="card-section">
                <div class="step-badge">1단계: 단어 암기</div>
                <div class="flashcard" id="flashcard">
                    <div class="card-front">
                        <div class="word-audio-wrapper">
                            <h2 id="study-word">word</h2>
                            <button id="btn-speak" class="btn-audio" title="발음 듣기">🔊</button>
                        </div>
                        <p id="study-meaning">뜻</p>
                    </div>
                    <div class="card-back">
                        <span class="example-tag">Example Sentence</span>
                        <p id="study-example"><i>예문이 들어갑니다.</i></p>
                    </div>
                </div>
                <div class="hint-text">카드를 클릭하면 예문을 확인할 수 있습니다.</div>
                <div class="btn-group">
                    <button id="btn-prev" class="btn secondary">이전</button>
                    <button id="btn-next-word" class="btn primary">다음 단어</button>
                </div>
            </section>

            <section id="step-quiz" class="card-section hidden">
                <div class="step-badge">2단계: 영영 퀴즈 도전</div>
                <div class="quiz-question">
                    <h2 id="quiz-definition" class="definition-text">English definition goes here.</h2>
                    <p class="quiz-instruction">위 뜻풀이에 알맞은 영어 단어를 고르세요.</p>
                </div>
                <div class="quiz-options" id="quiz-options">
                    </div>
                <div id="quiz-feedback" class="feedback-text"></div>
            </section>

            <section id="step-result" class="card-section hidden">
                <div class="step-badge">3단계: 학습 완료</div>
                <div class="result-container">
                    <h2>수고하셨습니다!</h2>
                    <p class="score-text">맞춘 개수: <span id="final-score">0</span> / <span id="total-words">0</span></p>
                    <button id="btn-restart" class="btn primary">처음부터 다시 하기</button>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
